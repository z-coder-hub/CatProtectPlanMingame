<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pixel-style game title - vector master (editable source)
  Text: Qi-Hua-Ai-Qu-Wan-Er (柒婳爱趣玩儿)
  v2 (readability fix): font-size raised 24 -> 30 and letter-spacing 5 added
  so the six characters' outlines never touch (v1 at 24px had merged,
  ambiguous glyphs). Small viewBox keeps the chunky pixel-font look.
  Pipeline: this SVG -> Edge headless raster (213x48) -> posterize 3 colors ->
            nearest-neighbor x3 (639x144) -> centered on 640x160 canvas
  Generated by: tools\gen_title_pixel_svg.ps1 (SVG master version; gen_title_pixel.ps1 is the old GDI+ pipeline, kept for reference)
  Output: assets\resources\images\ui\game_title_pixel.png
  Palette: white fill + dark purple outline #281E3C (matches the old label outline 40,30,60)
  paint-order="stroke" draws the dark outline UNDER the white fill; shape-rendering="crispEdges" turns anti-aliasing off.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 48" width="213" height="48">
  <text x="109" y="35" text-anchor="middle" font-family="Microsoft YaHei" font-weight="bold" font-size="30" letter-spacing="5" fill="#FFFFFF" shape-rendering="crispEdges" paint-order="stroke" stroke="#281E3C" stroke-width="1" stroke-linejoin="round">柒婳爱趣玩儿</text>
</svg>
