<?xml version="1.0" encoding="UTF-8"?>
<!--
  Game logo - vector source (editable master)
  Circular badge: cat-ear castle + crowned orange cat mascot
  Matches assets/textures/game_logo_1024.png generated by tools/gen_logo.ps1
  Palette: warm orange/gold badge, cream castle, orange cat
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>

  <!-- ================= badge base ================= -->
  <circle cx="512" cy="512" r="472" fill="#D84315"/>
  <circle cx="512" cy="512" r="436" fill="url(#bgGrad)"/>
  <circle cx="512" cy="512" r="436" fill="none" stroke="#FFF3E0" stroke-width="5" opacity="0.82"/>
  <circle cx="512" cy="512" r="472" fill="none" stroke="#9A3412" stroke-width="6"/>

  <!-- rivet dots (R=454, 45 deg steps) -->
  <g fill="#FFD54F" stroke="#9A3412" stroke-width="4">
    <circle cx="966" cy="512" r="13"/>
    <circle cx="833" cy="833" r="13"/>
    <circle cx="512" cy="966" r="13"/>
    <circle cx="191" cy="833" r="13"/>
    <circle cx="58"  cy="512" r="13"/>
    <circle cx="191" cy="191" r="13"/>
    <circle cx="512" cy="58"  r="13"/>
    <circle cx="833" cy="191" r="13"/>
  </g>

  <!-- ================= castle ================= -->
  <!-- side tower bodies -->
  <rect x="300" y="480" width="80" height="100" rx="10" fill="#FFF8E1" stroke="#6D4C41" stroke-width="10"/>
  <rect x="644" y="480" width="80" height="100" rx="10" fill="#FFF8E1" stroke="#6D4C41" stroke-width="10"/>
  <!-- side roofs -->
  <polygon points="300,480 380,480 340,395" fill="#FB8C00" stroke="#9A3412" stroke-width="9" stroke-linejoin="round"/>
  <polygon points="644,480 724,480 684,395" fill="#FB8C00" stroke="#9A3412" stroke-width="9" stroke-linejoin="round"/>
  <!-- flags -->
  <line x1="340" y1="395" x2="340" y2="345" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
  <polygon points="340,347 378,362 340,377" fill="#E53935"/>
  <line x1="684" y1="395" x2="684" y2="345" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
  <polygon points="684,347 646,362 684,377" fill="#E53935"/>
  <!-- side windows -->
  <circle cx="340" cy="510" r="15" fill="#FFF3E0" stroke="#8D6E63" stroke-width="6"/>
  <line x1="340" y1="495" x2="340" y2="525" stroke="#8D6E63" stroke-width="5" stroke-linecap="round"/>
  <line x1="325" y1="510" x2="355" y2="510" stroke="#8D6E63" stroke-width="5" stroke-linecap="round"/>
  <circle cx="684" cy="510" r="15" fill="#FFF3E0" stroke="#8D6E63" stroke-width="6"/>
  <line x1="684" y1="495" x2="684" y2="525" stroke="#8D6E63" stroke-width="5" stroke-linecap="round"/>
  <line x1="669" y1="510" x2="699" y2="510" stroke="#8D6E63" stroke-width="5" stroke-linecap="round"/>
  <!-- center tower body -->
  <rect x="452" y="410" width="120" height="150" rx="10" fill="#FFF8E1" stroke="#6D4C41" stroke-width="10"/>
  <!-- center cat-ear roof (signature) -->
  <polygon points="436,420 588,420 552,300 566,220 520,300 504,300 458,220 472,300"
           fill="#FB8C00" stroke="#9A3412" stroke-width="9" stroke-linejoin="round"/>
  <!-- center window -->
  <circle cx="512" cy="455" r="26" fill="#FFF3E0" stroke="#8D6E63" stroke-width="7"/>
  <line x1="512" y1="429" x2="512" y2="481" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
  <line x1="486" y1="455" x2="538" y2="455" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
  <!-- main wall -->
  <rect x="380" y="560" width="264" height="100" rx="8" fill="#FFF8E1" stroke="#6D4C41" stroke-width="10"/>
  <!-- battlements -->
  <rect x="380" y="535" width="26" height="25" rx="4" fill="#FFF8E1" stroke="#6D4C41" stroke-width="8"/>
  <rect x="414" y="535" width="26" height="25" rx="4" fill="#FFF8E1" stroke="#6D4C41" stroke-width="8"/>
  <rect x="448" y="535" width="26" height="25" rx="4" fill="#FFF8E1" stroke="#6D4C41" stroke-width="8"/>
  <rect x="482" y="535" width="26" height="25" rx="4" fill="#FFF8E1" stroke="#6D4C41" stroke-width="8"/>
  <rect x="516" y="535" width="26" height="25" rx="4" fill="#FFF8E1" stroke="#6D4C41" stroke-width="8"/>
  <rect x="550" y="535" width="26" height="25" rx="4" fill="#FFF8E1" stroke="#6D4C41" stroke-width="8"/>
  <rect x="584" y="535" width="26" height="25" rx="4" fill="#FFF8E1" stroke="#6D4C41" stroke-width="8"/>
  <rect x="618" y="535" width="26" height="25" rx="4" fill="#FFF8E1" stroke="#6D4C41" stroke-width="8"/>

  <!-- ================= cat mascot ================= -->
  <!-- ears -->
  <polygon points="398,625 424,505 468,600" fill="#F57C00" stroke="#D84315" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="556,600 600,505 626,625" fill="#F57C00" stroke="#D84315" stroke-width="10" stroke-linejoin="round"/>
  <!-- inner ears -->
  <polygon points="414,590 432,525 452,585" fill="#FFAB91"/>
  <polygon points="572,585 592,525 610,590" fill="#FFAB91"/>
  <!-- face -->
  <circle cx="512" cy="700" r="140" fill="#F57C00" stroke="#D84315" stroke-width="12"/>
  <!-- crown -->
  <polygon points="452,560 452,532 478,548 512,524 546,548 572,532 572,560"
           fill="#FFD54F" stroke="#B45309" stroke-width="8" stroke-linejoin="round"/>
  <!-- crown jewels -->
  <circle cx="478" cy="548" r="7" fill="#E53935"/>
  <circle cx="512" cy="530" r="8" fill="#42A5F5"/>
  <circle cx="546" cy="548" r="7" fill="#E53935"/>
  <!-- eyes (happy closed) -->
  <path d="M 500.07 696.18 Q 470 723.8 439.93 696.18" fill="none" stroke="#4E342E" stroke-width="13" stroke-linecap="round"/>
  <path d="M 584.07 696.18 Q 554 723.8 523.93 696.18" fill="none" stroke="#4E342E" stroke-width="13" stroke-linecap="round"/>
  <!-- muzzle -->
  <circle cx="512" cy="746" r="46" fill="#FFF3E0"/>
  <!-- nose -->
  <polygon points="498,724 526,724 512,740" fill="#F06292"/>
  <!-- mouth -->
  <path d="M 528.91 752.74 Q 512 763.3 495.09 752.74" fill="none" stroke="#4E342E" stroke-width="7" stroke-linecap="round"/>
  <!-- whiskers -->
  <line x1="436" y1="690" x2="330" y2="672" stroke="#4E342E" stroke-width="6" stroke-linecap="round"/>
  <line x1="436" y1="706" x2="332" y2="716" stroke="#4E342E" stroke-width="6" stroke-linecap="round"/>
  <line x1="588" y1="690" x2="694" y2="672" stroke="#4E342E" stroke-width="6" stroke-linecap="round"/>
  <line x1="588" y1="706" x2="692" y2="716" stroke="#4E342E" stroke-width="6" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="468" cy="717" r="18" fill="#FF8A80" opacity="0.67"/>
  <circle cx="556" cy="717" r="18" fill="#FF8A80" opacity="0.67"/>
  <!-- collar + bell -->
  <ellipse cx="512" cy="823" rx="38" ry="11" fill="#E53935" stroke="#B71C1C" stroke-width="4"/>
  <circle cx="512" cy="824" r="12" fill="#FFD54F" stroke="#B45309" stroke-width="4"/>

  <!-- ================= sparkles ================= -->
  <g fill="#FFF3E0" opacity="0.9">
    <polygon points="300,224 304.5,235.5 316,240 304.5,244.5 300,256 295.5,244.5 284,240 295.5,235.5"/>
    <polygon points="724,206 727.9,216.1 738,220 727.9,223.9 724,234 720.1,223.9 710,220 720.1,216.1"/>
    <polygon points="210,418 213.4,426.6 222,430 213.4,433.4 210,442 206.6,433.4 198,430 206.6,426.6"/>
    <polygon points="800,377 803.6,386.4 813,390 803.6,393.6 800,403 796.4,393.6 787,390 796.4,386.4"/>
    <polygon points="512,122 517,135 530,140 517,145 512,158 507,145 494,140 507,135"/>
  </g>
</svg>
